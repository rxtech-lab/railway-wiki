services:
  # The server uses TursoDB (libSQL). For local development point DATABASE_URL
  # at a local SQLite file (e.g. file:railway.db) or a remote Turso instance;
  # no local database container is required.
  #
  # minio provides an S3-compatible endpoint for testing presigned media uploads
  # and the e2e suite (set S3_ENDPOINT=http://localhost:9000, S3_PATH_STYLE=true,
  # S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY=minioadmin).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  # One-shot init: create the media bucket and make objects publicly readable so
  # the canonical Media.url is fetchable (used by the e2e media-upload test).
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/railway-wiki &&
      mc anonymous set download local/railway-wiki
      "

volumes:
  minio-data:
