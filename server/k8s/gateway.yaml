# nginx gateway: single entry point that enforces route-scoped API keys and routes
# /maps/  -> tileserver   and   /overpass/ -> overpass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf
  labels:
    app.kubernetes.io/part-of: osm-stack
data:
  default.conf: |
    server {
      listen 80;

      # Health check — no key required (used by k8s probes / LB).
      location = /healthz {
        return 200 "ok\n";
      }

      # Unknown paths are never proxied and do not disclose key validity.
      location / {
        return 404;
      }

      # Basemap tiles / styles. Only the distributable iOS maps key is valid.
      location /maps/ {
        if ($maps_api_key_valid = 0) { return 401; }
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # OSM feature queries. Only the server-held backend key is valid.
      location /overpass/ {
        if ($overpass_api_key_valid = 0) { return 401; }
        proxy_pass http://overpass:80/;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: osm-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # Server block.
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # Route-specific `map` blocks — auto-included via conf.d/*.conf
            # so it lands at http scope (outside any server block).
            - name: keys
              mountPath: /etc/nginx/conf.d/keys.conf
              subPath: keys.conf
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
      volumes:
        - name: conf
          configMap:
            name: gateway-conf
        - name: keys
          secret:
            secretName: map-api-keys
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: osm-stack
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
