          description: HTTP method to use for the upload.
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers that must be sent verbatim with the upload request.
        url:
          type: string
          format: uri
          description: Canonical URL of the object once uploaded; store this as Media.url.
        key:
          type: string
          description: Storage object key/path.
        expiresAt:
          type: string
          format: date-time
          description: When the presigned URL expires.
