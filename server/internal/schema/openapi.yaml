      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaAttachmentRequest'
      responses:
        '201':
          description: The created MediaAttachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/management/media-attachments/schema:
    get:
      summary: Get the form JSON Schema for MediaAttachment
      description: Returns the JSON Schema (draft 2020-12) for the requested action's request body (`create`
        = POST, `update` = PUT), so the frontend can render and validate that management form automatically.
      operationId: adminGetMediaAttachmentSchema
      tags:
      - Media Attachments (Management)
      parameters:
      - name: action
        in: query
        required: true
        description: Which management action's request-body schema to return.
        schema:
          type: string
          enum:
          - create
          - update
      responses:
        '200':
          description: JSON Schema for the MediaAttachment {action} body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/management/media-attachments/{id}:
    get:
      summary: Get a MediaAttachment by id (management)
      operationId: adminGetMediaAttachment
      tags:
      - Media Attachments (Management)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The requested MediaAttachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace a MediaAttachment
      operationId: adminUpdateMediaAttachment
      tags:
      - Media Attachments (Management)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMediaAttachmentRequest'
      responses:
        '200':
          description: The updated MediaAttachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a MediaAttachment
      operationId: adminDeleteMediaAttachment
      tags:
      - Media Attachments (Management)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Deleted; no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/management/media/upload-url:
    post:
      summary: Create a presigned upload URL for a media file
      description: Returns a short-lived presigned URL the client uses to upload the file bytes directly
        to object storage. After a successful upload, create the Media record with `adminCreateMedia`
        using the returned `url`.
      operationId: adminCreateMediaUploadUrl
      tags:
      - Media (Management)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignMediaUploadRequest'
      responses:
        '201':
          description: Presigned upload target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadTarget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/management/dashboard:
    get:
      summary: Get management dashboard metrics
      operationId: adminGetDashboard
      tags:
      - Health
      responses:
        '200':
          description: Resource counts and station coordinate coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/management/overpass/stations:
    get:
      summary: Find bounded railway station candidates through Overpass
      description: Supply either all viewport bounds or latitude/longitude. Arbitrary Overpass QL is never accepted.
      operationId: adminSearchOverpassStations
      tags:
      - Stations (Management)
      parameters:
      - $ref: '#/components/parameters/SouthParam'
      - $ref: '#/components/parameters/WestParam'
      - $ref: '#/components/parameters/NorthParam'
      - $ref: '#/components/parameters/EastParam'
      - name: lat
        in: query
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: lon
        in: query
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: radiusMeters
        in: query
        description: Radial search distance; defaults to 2000 metres.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 2000
      responses:
        '200':
          description: Normalized railway station candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverpassStationCandidatePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/management/overpass/stations/{elementType}/{elementId}/import:
    post:
      summary: Refetch and import one Overpass station candidate
      operationId: adminImportOverpassStation
      tags:
      - Stations (Management)
      parameters:
      - name: elementType
        in: path
        required: true
        schema:
          type: string
          enum: [node, way, relation]
      - name: elementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStationRequest'
      responses:
        '200':
          description: Station already imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '201':
          description: Newly imported station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/management/routes/{id}/configuration:
    get:
      summary: Get a route and its ordered stations
      operationId: adminGetRouteConfiguration
      tags:
      - Routes (Management)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Route editor configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atomically replace a route and its ordered stations
      operationId: adminUpdateRouteConfiguration
      tags:
      - Routes (Management)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteConfigurationRequest'
      responses:
        '200':
          description: Saved route configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/management/routes/{id}/configuration/validate:
    post:
      summary: Validate an unsaved route configuration
      operationId: adminValidateRouteConfiguration
      tags:
      - Routes (Management)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteConfigurationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteValidationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer authentication; management endpoints require role `admin`.
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's pagination.next.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdParam:
      name: id
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid
    SouthParam:
      name: south
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    WestParam:
      name: west
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    NorthParam:
      name: north
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    EastParam:
      name: east
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict (e.g. duplicate)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Request rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Upstream Overpass service failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: Upstream Overpass service timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DashboardResourceMetric:
      type: object
      required: [resource, count]
      properties:
        resource:
          type: string
        count:
          type: integer
          format: int64
    DashboardStationCoverage:
      type: object
      required: [total, withCoordinates]
      properties:
        total:
          type: integer
          format: int64
        withCoordinates:
          type: integer
          format: int64
    DashboardResponse:
      type: object
      required: [resources, stationCoverage, generatedAt]
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/DashboardResourceMetric'
        stationCoverage:
          $ref: '#/components/schemas/DashboardStationCoverage'
        generatedAt:
          type: string
          format: date-time
    OverpassStationCandidate:
      type: object
      required: [elementType, elementId, name, latitude, longitude, tags]
      properties:
        elementType:
          type: string
          enum: [node, way, relation]
        elementId:
          type: integer
          format: int64
        name:
          type: string
        nameEn:
          type: string
        ref:
          type: string
        railway:
          type: string
        mode:
          type: string
        operator:
          type: string
        network:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        tags:
          type: object
          additionalProperties:
            type: string
        importedStationId:
          type: string
          format: uuid
    OverpassStationCandidatePage:
      type: object
      required: [items, generatedAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OverpassStationCandidate'
        generatedAt:
          type: string
          format: date-time
    ImportStationRequest:
      type: object
      properties:
        overrides:
          $ref: '#/components/schemas/UpdateStationRequest'
    RouteStationDraft:
      type: object
      required: [stationId]
      properties:
        id:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
        distanceFromStartKm:
          type: number
          format: double
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    RouteConfigurationRequest:
      type: object
      required: [route, stations]
      properties:
        route:
          $ref: '#/components/schemas/UpdateRouteRequest'
        stations:
          type: array
          items:
            $ref: '#/components/schemas/RouteStationDraft'
    RouteConfiguration:
      type: object
      required: [route, stations]
      properties:
        route:
          $ref: '#/components/schemas/Route'
        stations:
          type: array
          items:
            $ref: '#/components/schemas/RouteStation'
    RouteValidationResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
          example: not_found
    Pagination:
      type: object
      properties:
        next:
          type: string
          nullable: true
