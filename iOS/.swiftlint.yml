included:
  - iOS
  - iOSTests
  - iOSUITests
excluded:
  - DerivedData
  - build
reporter: xcode
disabled_rules:
  - static_over_final_class
file_length:
  warning: 350
  error: 500
type_body_length:
  warning: 250
  error: 350
function_body_length:
  warning: 60
  error: 100
cyclomatic_complexity:
  warning: 12
  error: 20
line_length:
  warning: 130
  error: 180
  ignores_comments: true
identifier_name:
  min_length: 2
