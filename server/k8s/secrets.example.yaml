# Template for the API-key Secret.
#
#   cp secrets.example.yaml secrets.yaml
#   # edit secrets.yaml with real keys, then apply it.
#
# secrets.yaml is git-ignored (see server/.gitignore) — NEVER commit real keys.
#
# The Secret ships two nginx `map` snippets. The iOS maps key can only read
# /maps/ and the backend key can only call /overpass/. Never put the backend
# key in an application bundle.
apiVersion: v1
kind: Secret
metadata:
  name: map-api-keys
  labels:
    app.kubernetes.io/part-of: osm-stack
type: Opaque
stringData:
  keys.conf: |
    map $http_x_api_key $maps_api_key_valid {
      default                          0;
      "REPLACE_WITH_IOS_MAPS_KEY"      1;
    }

    map $http_x_api_key $overpass_api_key_valid {
      default                          0;
      "REPLACE_WITH_BACKEND_KEY"       1;
    }
