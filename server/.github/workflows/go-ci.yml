name: Go CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Install dependencies
        run: make install

      - name: Generate code
        run: make generate

      - name: Build
        run: go mod tidy && make build

      # Unit tests use an in-memory SQLite database (internal/testutil) and need
      # no external services.
      - name: Test
        run: make test
