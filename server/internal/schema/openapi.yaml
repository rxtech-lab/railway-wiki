# Generated for railway-wiki. Source of truth for oapi-codegen.
openapi: 3.0.0
info:
  title: Railway Wiki API
  description: 'Railway wiki API. Public **view** endpoints under `/api/{resource}` are read-only and
    open; **management** endpoints under `/api/management/{resource}` require a bearer token whose
    principal has the `admin` role and provide full CRUD.


    List/search responses use cursor pagination: `{ items, pagination: { next } }`. Errors use `{ error,
    code }`. Single-object responses are returned bare (never wrapped in a `data` envelope).'
  version: 1.0.0
