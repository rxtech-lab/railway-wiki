name: iOS CI

on:
  push:
permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  swiftlint:
    name: SwiftLint 0.65.0
    runs-on: [self-hosted, macOS, ARM64, regular]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: iOS
    env:
      SOURCE_PACKAGES_DIR: railway-wiki-source-packages

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Restore resolved packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_DIR }}
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iOS/iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve pinned packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project iOS.xcodeproj
          -scheme iOS
          -clonedSourcePackagesDirPath "${SOURCE_PACKAGES_DIR}"

      - name: Strict SwiftLint from resolved artifact
        run: ./scripts/swiftlint.sh "${SOURCE_PACKAGES_DIR}"

  xctest:
    name: XCUITest (${{ matrix.label }})
    runs-on: macos-26
    timeout-minutes: 60
    needs: swiftlint
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iPad
            device: iPad Pro 13-inch (M5)
          - label: iPhone
            device: iPhone 17 Pro
    defaults:
      run:
        working-directory: iOS
    env:
      SOURCE_PACKAGES_DIR: ${{ runner.temp }}/railway-wiki-source-packages

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Restore resolved packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_DIR }}
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iOS/iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve pinned packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project iOS.xcodeproj
          -scheme iOS
          -clonedSourcePackagesDirPath "${SOURCE_PACKAGES_DIR}"

      - name: Select ${{ matrix.device }} simulator
        id: simulator
        run: |
          DEVICE_UDID=$(python3 scripts/select-simulator.py "${{ matrix.device }}")
          echo "device_udid=${DEVICE_UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${DEVICE_UDID}" || true
          xcrun simctl bootstatus "${DEVICE_UDID}" -b

      - name: Build and test
        run: >-
          xcodebuild test
          -project iOS.xcodeproj
          -scheme iOS
          -configuration Debug
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_udid }}"
          -derivedDataPath "${RUNNER_TEMP}/railway-wiki-derived-data"
          -clonedSourcePackagesDirPath "${SOURCE_PACKAGES_DIR}"
          -parallel-testing-enabled NO
          -skipPackagePluginValidation

  maestro:
    name: Maestro acceptance (${{ matrix.label }})
    runs-on: macos-26
    timeout-minutes: 60
    needs: swiftlint
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iPad
            device: iPad Pro 13-inch (M5)
            flow: .maestro
          - label: iPhone
            device: iPhone 17 Pro
            flow: Tests/Maestro/compact-navigation.yaml
    defaults:
      run:
        working-directory: iOS
    env:
      MAESTRO_VERSION: 2.4.0
      SOURCE_PACKAGES_DIR: ${{ runner.temp }}/railway-wiki-source-packages
      DERIVED_DATA_DIR: ${{ runner.temp }}/railway-wiki-maestro-derived-data

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Maestro CLI
        run: |
          export MAESTRO_VERSION
          curl --fail --silent --show-error --location https://get.maestro.mobile.dev | bash
          echo "${HOME}/.maestro/bin" >> "${GITHUB_PATH}"
          "${HOME}/.maestro/bin/maestro" --version | grep --fixed-strings "${MAESTRO_VERSION}"

      - name: Restore resolved packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_DIR }}
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iOS/iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve pinned packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project iOS.xcodeproj
          -scheme iOS
          -clonedSourcePackagesDirPath "${SOURCE_PACKAGES_DIR}"

      - name: Boot ${{ matrix.device }} simulator
        id: simulator
        run: |
          DEVICE_UDID=$(python3 scripts/select-simulator.py "${{ matrix.device }}")
          echo "device_udid=${DEVICE_UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${DEVICE_UDID}" || true
          xcrun simctl bootstatus "${DEVICE_UDID}" -b

      - name: Build app for Maestro
        run: >-
          xcodebuild build
          -project iOS.xcodeproj
          -scheme iOS
          -configuration Debug
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_udid }}"
          -derivedDataPath "${DERIVED_DATA_DIR}"
          -clonedSourcePackagesDirPath "${SOURCE_PACKAGES_DIR}"
          -skipPackagePluginValidation

      - name: Install app
        run: >-
          xcrun simctl install
          "${{ steps.simulator.outputs.device_udid }}"
          "${DERIVED_DATA_DIR}/Build/Products/Debug-iphonesimulator/iOS.app"

      - name: Run Maestro flows
        env:
          MAESTRO_DEVICE_UDID: ${{ steps.simulator.outputs.device_udid }}
        run: ./scripts/maestro-test.sh "${{ matrix.flow }}"

  e2e-ios:
    name: iOS E2E (real server, iPad)
    runs-on: macos-26
    timeout-minutes: 60
    needs: swiftlint
    defaults:
      run:
        working-directory: iOS
    env:
      SOURCE_PACKAGES_DIR: ${{ runner.temp }}/railway-wiki-source-packages
      DERIVED_DATA_DIR: ${{ runner.temp }}/railway-wiki-e2e-derived-data
      E2E_SERVER_LOG: ${{ runner.temp }}/railway-e2e-server.log
      E2E_XCODEBUILD_LOG: ${{ runner.temp }}/railway-e2e-xcodebuild.log
      E2E_RESULT_BUNDLE: ${{ runner.temp }}/railway-e2e.xcresult

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Restore resolved packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_DIR }}
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iOS/iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve pinned packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project iOS.xcodeproj
          -scheme iOS
          -clonedSourcePackagesDirPath "${SOURCE_PACKAGES_DIR}"

      - name: Prepare simulator (clean state)
        run: |
          xcrun simctl shutdown all 2>/dev/null || true
          xcrun simctl erase all 2>/dev/null || true
          DEVICE_UDID=$(python3 scripts/select-simulator.py "iPad Pro 13-inch (M5)")
          xcrun simctl boot "${DEVICE_UDID}" || true
          xcrun simctl bootstatus "${DEVICE_UDID}" -b

      - name: Run UI test against real E2E_MODE server
        run: ./scripts/e2e-ios.sh

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-e2e-server-log
          path: ${{ env.E2E_SERVER_LOG }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-e2e-xcodebuild-log
          path: ${{ env.E2E_XCODEBUILD_LOG }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-e2e-xcresult
          path: ${{ env.E2E_RESULT_BUNDLE }}
          retention-days: 7
          if-no-files-found: ignore
